:root{--ink:#181a19;--paper:#ece8da;--red:#a9452c;--gold:#bbb06a;--teal:#243e3e}*{box-sizing:border-box}body{margin:0;background:#111;color:var(--paper);font-family:'Noto Serif CJK SC','Songti SC','SimSun',serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #e9d897;outline-offset:3px}.screen{min-height:100dvh;position:relative;overflow:hidden;background:var(--ink)}.silk{background:var(--paper);color:#25251e}.texture:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,#987a4e09 0 1px,transparent 1px 4px);z-index:2}.scene{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1s}.layer{position:absolute;pointer-events:none;object-fit:contain}.topbar{position:absolute;top:0;left:0;width:100%;height:68px;background:#111e;z-index:20;display:flex;align-items:center;padding:0 4%;gap:28px;font-size:15px}.topbar.light{background:#ede9dbe9;color:#24241f}.topbar button{border:0;background:none;color:inherit;padding:10px 3px;white-space:nowrap}.topbar button:hover,.topbar button.active{border-bottom:1px solid var(--gold)}.topbar .brand{font-size:22px;letter-spacing:.18em;margin-right:20px}.spacer{flex:1}.topbar small{color:var(--gold)}.hero{background:#756b57;display:grid;place-items:center;text-align:center}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(#4a403474,#5a4d3b30),url('assets/river-layer.png') center/cover;filter:sepia(.6) brightness(.55)}.hero-content{z-index:3;padding:40px}.hero h1{font-size:clamp(44px,7vw,112px);font-weight:400;letter-spacing:.16em;margin:0}.hero p{font-size:clamp(15px,2vw,30px);letter-spacing:.4em}.eyebrow{font-size:12px;letter-spacing:.35em;color:var(--gold)}.seal{background:#b11f13;color:#fff1d7;border:1px solid #d3784e;padding:12px 31px;margin-top:55px;box-shadow:0 0 0 4px #9c251a;font-size:20px}.hero-people{position:absolute;left:2%;bottom:-8%;height:48%;opacity:.82;filter:sepia(.55)}.openin p:27%;left:62%;width:33%;z-index:5}.right h1{font-size:clamp(44px,5vw,82px);font-weight:400;margin:8px 0}.right h2{font-weight:400;font-size:30px}.right p{font-size:20px;line-height:1.9}.choice{display:block;width:100%;border:0;border-top:1px solid #d7aa71;background:none;color:var(--paper);padding:15px 0;text-align:left;font-size:20px}.choice:hover{color:#ffe6ad}.game .scene{background-image:url('assets/stall-layer.png')}.game .baker{height:64%;left:11%;top:21%;opacity:.95}.instruction{position:absolute;z-index:6;right:6%;top:16%;width:min(390px,36%);background:#1c3939e6;padding:22px 28px;color:#eee4ce}.instruction h1{font-weight:400;font-size:35px;margin:0 0 15px}.instruction p{line-height:1.6}.instruction .steps{color:var(--gold);font-size:13px}.object{position:absolute;z-index:8;border:1px dashed #fff;background:#fff4;border-radius:50%;width:9%;aspect-ratio:1;color:#fff;text-shadow:0 1px 3px #333;font-size:13px}.object:hover{background:#fff8}.return{position:absolute;z-index:10;bottom:3%;left:4%;background:#1c3939cc;color:#eee4ce;border:1px solid var(--gold);padding:8px 16px}.book{background:var(--ink)}.book h1{position:absolute;left:5%;top:12%;font-weight:400;font-size:45px}.book .sun{position:absolute;left:8%;top:16%;width:50vw;height:50vw;max-width:700px;max-height:700px;background:#a9452c;border-radius:50%}.book .person{position:absolute;z-index:3;object-fit:contain;filter:sepia(.25)}.book .baker{left:22%;top:18%;height:50%}.book .boatman{left:1%;top:38%;height:60%}.book .merchant{left:43%;top:43%;height:33%;opacity:.45;filter:sepia(.8)}.book .relation-line{position:absolute;left:25%;top:61%;width:28%;height:2px;background:var(--gold);transform:rotate(-25deg);transform-origin:left}.book .details{position:absolute;z-index:5;left:70%;top:25%;right:4%;line-height:1.8}.details h2{font-size:34px;font-weight:400}.details p{font-size:19px}.tabs{position:absolute;z-index:9;left:5%;top:9%;display:flex;gap:20px}.tabs button{background:none;border:0;color:#eee4ce;border-bottom:1px solid var(--gold);padding:8px}.bio{background:var(--paper);color:#171817}.bio .scene{width:60%;right:auto;background-image:url('assets/stall-layer.png');filter:sepia(.25)}.bio .baker{height:75%;left:8%;bottom:0}.bio article{position:absolute;z-index:5;left:62%;top:18%;width:33%}.bio h1{font-size:70px;font-weight:400;margin:0}.bio h2{font-size:28px;font-weight:400}.bio p{font-size:20px;line-height:1.7}.bio hr{border:0;border-top:1px solid var(--gold);margin:24px 0}.end{text-align:center;background:#151616}.end .sun{position:absolute;left:-12%;top:-5%;height:75vw;width:75vw;border-radius:50%;background:var(--red)}.end .city{position:absolute;bottom:0;width:100%;height:42%;background:url('assets/river-layer.png') center bottom/cover;filter:sepia(.4) brightness(.7)}.end .content{position:relative;z-index:6;padding-top:18vh}.end h1{font-size:clamp(50px,7vw,110px);font-weight:400}.end p{font-size:20px;letter-spacing:.24em}.end button{color:var(--paper);background:none;border:0;border-bottom:1px solid var(--gold);margin:35px 12px;padding:10px}.toast{position:absolute;z-index:30;left:50%;bottom:12%;transform:translateX(-50%);background:#203c3ce8;border-left:2px solid var(--gold);padding:15px 23px;max-width:70vw;line-height:1.6}.off{display:none!important}@media(max-width:700px){.topbar{height:54px;gap:7px;padding:0 2%;font-size:11px}.topbar .brand{font-size:13px;min-width:76px;margin:0}.topbar small{display:none}.dialogue .baker{height:59%;left:-15%;top:11%}.dialogue .right{top:44%;left:5%;width:90%;background:#a9452ce8;padding:10px}.right h1{font-size:37px}.right h2{font-size:19px}.right p,.choice{font-size:15px}.instruction{right:2%;top:12%;width:55%;padding:9px}.instruction h1{font-size:22px}.book .details{left:48%;top:39%;right:3%;font-size:12px}.details h2{font-size:22px}.details p{font-size:14px}.book .sun{top:30%;width:67vw;height:67vw}.book .baker{left:18%;top:33%;height:32%}.book .boatman{left:-15%;top:48%;height:38%}.bio article{left:8%;top:55%;width:85%;background:#eee8dce8}.bio h1{font-size:38px}.bio p{font-size:14px}.bio .scene{width:100%;height:60%}.bio .baker{height:50%;top:10%}.rollbar{font-size:11px;gap:4px;padding:0 1%}.rollbar .track{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main id="app"></main><script>
const app=document.getElementById('app');let state=JSON.parse(localStorage.getItem('bj-state')||'null')||{page:'home',frame:0,region:'river',met:{},played:{},clues:{},step:0,history:[]};function save(){localStorage.setItem('bj-state',JSON.stringify(state))}function go(page){state.page=page;save();render()}function toast(msg){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=msg;app.firstElementChild.appendChild(d);setTimeout(()=>d.remove(),3500)}function btn(label,fn,cls=''){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}function img(src,cls){let i=document.createElement('img');i.src='assets/'+src+'.png';i.className='layer '+cls;i.alt='';return i}function div(cls,html=''){let d=document.createElement('div');d.className=cls;d.innerHTML=html;return d}function scene(src){let d=div('scene');d.style.backgroundImage=`url(assets/${src}.png)`;return d}function header(light=false){let n=div('topbar'+(light?' light':''));n.append(btn('汴京无名录',()=>go('home'),'brand'));for(let [label,p] of [['游卷','scroll'],['无名录','book'],['汴京拾遗','bio']])n.append(btn(label,()=>go(p),state.page===p?'active':''));n.append(div('spacer'));n.append(btn('◖))',()=>toast('环境音素材尚未接入。'),'sound'));n.append(div('', '<small>中　EN</small>'));return n}function hotspot(label,x,y,action){let b=btn('',action,'hotspot');b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label',label);b.innerHTML='<span>'+label+'</span>';return b}function complete(){return state.played.baker&&state.played.boat&&state.clues.bread&&state.clues.goods}function clue(){if(state.played.baker&&state.met.boat){state.clues.bread=true;toast('关系确认：饼店主人每天为船夫留一张饼。')}save()}
function render(){app.innerHTML='';let p=state.page,root=div('screen '+p+(p==='home'||p==='opening'||p==='bio'?' texture':''));app.append(root);if(p==='home'){root.classList.add('hero');root.append(img('boatman-layer','hero-people'));let c=div('hero-content','<div class="eyebrow">THE UNNAMED OF BIANJING</div><h1>汴京无名录</h1><p>一卷人间，千载无名。</p>');c.append(btn('入画',()=>{state.frame=0;go('opening')},'seal'));root.append(c);return}
if(p==='opening'){let images=['river-layer','river-layer','stall-layer','river-layer'];root.append(scene(images[state.frame]));let text=[['第一幕 · 开卷','汴京的清晨，画卷自河岸缓缓展开。'],['第二幕 · 入市','河上行船，街边生火。每个人都有自己的去处。'],['第三幕 · 见人','你走近一位老人。他望向人群，似乎想起了什么。'],['序章 · 无名录','“我记不得自己的名字了。你能替我问问他们吗？”']][state.frame];let c=div('opening-card',`<div class="eyebrow">${text[0]}</div><h2>${text[1]}</h2>`);c.append(btn(state.frame===3?'领取无名录 →':'继续 →',()=>{if(state.frame<3){state.frame++;save();render()}else go('scroll')},'link'));root.append(c,btn('跳过',()=>go('scroll'),'skip'),div('frame-counter',`0${state.frame+1} / 04`));return}
root.append(header(p==='bio'));if(p==='scroll'){let bg=div('scene '+state.region);root.append(bg);if(state.region==='river'){root.append(hotspot('船夫',43,56,()=>visit('boat')),hotspot('饼店主人',75,70,()=>visit('baker')))}else if(state.region==='city'){root.append(hotspot('杂货商',67,67,()=>visit('merchant')),hotspot('测字先生',34,60,()=>visit('fortune')),hotspot('玩具艺人',82,47,()=>visit('toy')))}else{root.append(hotspot('行脚僧',30,60,()=>visit('monk')))}root.append(div('hint',`${{river:'汴河 · 虹桥',city:'城内 · 百业',outskirts:'城郊 · 行旅'}[state.region]}　｜　沿画卷寻找人物，点击白色圆环`));let bar=div('rollbar');for(let [l,r] of [['郊野','outskirts'],['虹桥','river'],['城内','city']])bar.append(btn(l,()=>{state.region=r;save();render()}));bar.append(div('track'));bar.append(btn('无名录',()=>go('book')),btn('欣赏原画',()=>toast('当前是补绘概念场景；高清原作接入后开放此模式。')));root.append(bar);return}
if(p==='dialogue'){root.append(img(({boat:'boatman-layer',baker:'baker-layer',merchant:'merchant-layer',fortune:'fortune-layer',monk:'monk-layer',toy:'toy-layer'})[state.npc],'baker'));let info={baker:['饼店主人','五更炉火','“客官，可否替我照看一会儿炉火？”'],boat:['船夫','虹桥通船','“这桥下水急，靠我一人可过不去。”'],merchant:['杂货商','远方的货','“船家带来的小玩意，孩子们最爱看。”'],fortune:['测字先生','旧时往事','“这位老人，我似乎曾在别处见过。”'],monk:['行脚僧','路上相逢','“路很长，总有人替我留一盏灯。”'],toy:['玩具艺人','街头百戏','“这件小玩具，曾是那位行脚僧替我捡回的。”']}[state.npc];let r=div('right',`<div class="eyebrow">人物对话 · 剧情创作</div><h1>${info[0]}</h1><h2>${info[1]}</h2><p>${info[2]}</p>`);r.append(btn(state.npc==='baker'?'帮他照看炉火 →':state.npc==='boat'?'协助通船 →':'听他讲述 →',()=>{if(['baker','boat'].includes(state.npc)){state.step=0;go('game')}else{state.played[state.npc]=true;if(state.npc==='merchant'&&state.met.boat)state.clues.goods=true;if(state.npc==='toy'&&state.met.monk)state.clues.kindness=true;save();toast(state.npc==='merchant'?'新线索：船夫会为杂货商带货。':state.npc==='toy'?'新线索：玩具艺人曾得到行脚僧的帮助。':'新线索已记录在无名录。')}} ,'choice'));r.append(btn('谈谈那位老人 →',()=>toast('“那位老人？我见过他在人群里帮忙，但我从未问过他的姓名。”'),'choice'));root.append(r,btn('← 返回画卷',()=>go('scroll'),'return'));return}
if(p==='game'){root.append(scene(state.npc==='boat'?'river-layer':'stall-layer'));if(state.npc==='baker')root.append(img('baker-layer','baker'));let arr=state.npc==='boat'?['扶住船篙','调整船位','协力过桥']:['擀开面团','撒上芝麻','送入炉中'];let panel=div('instruction',`<div class="eyebrow">场景内操作</div><h1>${state.npc==='boat'?'虹桥通船':'五更炉火'}</h1><p>${arr[state.step]}</p><div class="steps">${arr.map((x,i)=>i<=state.step?'●':'○').join(' ─ ')}</div>`);root.append(panel);let positions=state.npc==='boat'?[[42,55],[54,50],[65,50]]:[[35,66],[45,76],[60,56]];let [x,y]=positions[state.step];root.append(hotspot(arr[state.step],x,y,()=>{state.step++;if(state.step>=3){state.played[state.npc]=true;clue();state.step=0;go('dialogue');toast(state.npc==='boat'?'船只平安通过虹桥；再回访饼店主人。':'饼已出炉，饼店主人为船夫留了一张。')}else{save();render()}}));root.append(btn('← 返回人物',()=>go('dialogue'),'return'));return}
if(p==='book'){root.append(div('sun'),img('baker-layer','person baker'),img('boatman-layer','person boatman'),div('relation-line'));let t=div('tabs');t.append(btn('人间羁绊',()=>go('book')),btn('人物小传',()=>go('bio')),btn('汴京拾遗',()=>go('bio')));root.append(t);let detail=div('details',`<div class="eyebrow">无名录 · 人间羁绊</div><h2>一饼之交</h2><p>${state.clues.bread?'饼店主人每天为船夫留一张饼。':'似乎有人每天为河上的船家留着热饼。'}</p><p style="color:#b7ad61">${state.clues.bread?'两人证言已确认':'待寻访饼店主人和船夫'}</p><hr><p>${state.clues.goods?'船夫偶尔为杂货商带来远方的货物。':'杂货商似乎在等一位从河上归来的熟人。'}</p><hr><p>${state.clues.kindness?'玩具艺人曾得到行脚僧的帮助。':'行脚僧与玩具艺人似乎有过交集。'}</p><p>测字先生记得老人年轻时的一件往事。</p>`);if(complete())detail.append(btn('回访老人 · 合卷 →',()=>go('ending'),'choice'));root.append(detail);return}
if(p==='bio'){root.append(scene('stall-layer'),img('baker-layer','baker'));let a=document.createElement('article');a.innerHTML='<div class="eyebrow">人物小传 / 史料与创作</div><h1>五更炉火</h1><h2>饼店主人</h2><hr><p>他每日起得很早，为往来的人留一口热食。</p><p class="eyebrow">以上人物与关系为剧情创作</p><hr><p>《东京梦华录》有饼店相关记载；正式引文需据可靠版本逐条核对。</p>';a.append(btn('返回无名录 →',()=>go('book'),'link'));root.append(a);return}
if(p==='ending'){root.append(div('sun'),div('city'));let c=div('content','<div class="eyebrow">合卷</div><h1>汴京无名录</h1><p>我们未必留下姓名，却曾留在彼此的生活里。</p><div class="eyebrow">EVERY LIFE LEAVES A TRACE</div>');c.append(btn('重游画卷',()=>go('scroll')),btn('回望无名录',()=>go('book')));root.append(c)}}
function visit(npc){state.npc=npc;state.met[npc]=true;if(npc==='boat')clue();if(npc==='merchant'&&state.met.boat)state.clues.goods=true;save();go('dialogue')}window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!['home','scroll'].includes(state.page))go('scroll')});render();
</script></html>

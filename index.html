<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a241c">
  <meta name="description" content="走进《清明上河图》，替汴京的小人物跑一趟腿，看一块饼、一包线、一只木鸟如何把一座城连在一起。">
  <title>卷中人间</title>
</head>
<body>
  <main id="stage">
    <canvas id="scroll" aria-label="清明上河图，可拖动浏览"></canvas>
    <div id="pins"></div>
    <div class="paper" aria-hidden="true"></div>
  </main>

  <header id="bar" hidden>
    <button class="seal" id="home" aria-label="回到开篇">卷中<br>人间</button>
    <div class="tools">
      <button id="bag" class="chip" hidden><i></i><span></span></button>
      <button id="ledger" class="chip">人情簿 <b>0</b>/7</button>
      <button id="looks" class="chip">画中细看 <b>0</b>/<span id="looks-total"></span></button>
    </div>
  </header>

  <aside id="task" hidden>
    <p class="kicker"></p>
    <h2></h2>
    <p class="hint"></p>
    <button id="go" class="primary">指路</button>
  </aside>

  <nav id="minimap" hidden aria-label="全卷导航"><div class="strip"><div class="win"></div></div></nav>

  <section id="talk" hidden role="dialog" aria-live="polite">
    <img class="portrait" alt="">
    <div class="body">
      <p class="who"><b></b><span></span></p>
      <p class="line"></p>
      <div class="choices"></div>
      <p class="history" hidden></p>
      <div class="foot"><button class="ghost" id="talk-close">先走开</button><button class="primary" id="talk-next">继续</button></div>
    </div>
  </section>

  <section id="note" hidden>
    <button class="x" aria-label="关闭">×</button>
    <p class="kicker"></p>
    <h3></h3>
    <p class="text"></p>
  </section>

  <div id="toast" role="status"></div>

  <section id="cover">
    <div class="cover-box">
      <p class="kicker">清明上河图 · 互动画卷</p>
      <h1>卷中人间</h1>
      <p class="lead">一幅画里有五百多个人。<br>替他们跑一趟腿，看看一座城是怎样连在一起的。</p>
      <button class="primary big" id="start">展卷</button>
      <p class="small" id="resume-note" hidden></p>
      <button class="ghost" id="restart" hidden>重新开始</button>
      <p class="small">拖动画卷前行，点击朱砂圈与人交谈。画卷自右向左展开。</p>
    </div>
  </section>

  <section id="finale" hidden>
    <div class="finale-box">
      <p class="kicker">卷末</p>
      <h2>他们的名字，都不在史书里。</h2>
      <p class="lead">可这一天里，饼到了船上，线到了铺里，木鸟到了孩子手中，一句道谢走回了老人身边。<br>少了谁，这条街都会缺一块。</p>
      <p class="prompt">点一点下面的人，看看没有他会怎样。</p>
      <div class="roster"></div>
      <p class="effect"></p>
      <div class="finale-foot"><button class="ghost" id="roam">继续漫游画卷</button><button class="ghost" id="reset">重新开始</button></div>
    </div>
  </section>

  <section id="credit" hidden>
    <button class="x" aria-label="关闭">×</button>
    <p>画面为北宋张择端《清明上河图》，故宫博物院藏，公版影像取自 <a href="https://commons.wikimedia.org/wiki/File:Alongtheriver_QingMing.jpg" target="_blank" rel="noreferrer">Wikimedia Commons</a>。</p>
    <p>游戏里的姓名、对白与人物关系均为虚构；标有“宋时旧事”的段落据《东京梦华录》等史料概述，画中细看的说明则指向画面上真实可见的景物。</p>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>

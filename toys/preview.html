:root { color-scheme:light; --maroon:#79352a; --gold:#e4c37c; --cream:#eee2ce; --ink:#3b302b; }
*{box-sizing:border-box}
body{margin:0;color:var(--cream);background:#f1e9dc;font-family:'Noto Serif SC','Songti SC','SimSun',serif}
header{background:#231815;min-height:64px;padding:15px max(26px,calc((100vw - 1400px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:21px;letter-spacing:.22em;font-weight:600}.tag{font-size:12px;color:#d0b99e;letter-spacing:.12em}
nav{display:flex;gap:14px;align-items:center}.nav-btn{border:1px solid #967360;padding:9px 13px;background:transparent;color:#ebd5b5;cursor:pointer;border-radius:2px;font:inherit;font-size:13px}
main{background:var(--maroon);min-height:calc(100vh - 64px);max-width:1700px;margin:0 auto;padding:34px clamp(18px,3.5vw,58px) 26px}
.layout{display:grid;grid-template-columns:minmax(245px,34%) minmax(0,66%);gap:34px;min-height:660px}
.intro{display:flex;flex-direction:column;gap:20px}.eyebrow{font-size:12px;color:#e6bf87;letter-spacing:.24em}.intro h1{font-size:clamp(28px,3.3vw,52px);font-weight:400;line-height:1.3;margin:0}.intro p{font-size:15px;line-height:2;color:#ead6c3;max-width:470px;margin:0}
.reference-frame{position:relative;border:1px solid rgba(240,211,163,.28);background:#bba88a;padding:10px;max-width:450px;border-radius:2px;box-shadow:0 10px 35px #311c1633}
.reference-frame img{display:block;width:100%;height:295px;object-fit:cover;object-position:center;filter:sepia(.40) contrast(.85)}
.reference-frame .img-caption{position:absolute;bottom:10px;left:10px;right:10px;padding:8px;color:#e9d4b5;background:#3f2c25bb;font-size:11px;letter-spacing:.07em}
.help{font-size:12px;color:#e2c4ad;line-height:1.85;opacity:.85}.help b{color:#fff1d4;font-weight:normal}
.showroom{display:flex;flex-direction:column;gap:15px;min-width:0}
.showroom-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.section-label{font-size:18px;color:#f0dfc1;letter-spacing:.13em}.section-sub{font-size:12px;color:#eacbad}
.gallery{height:min(67vh,590px);min-height:435px;display:flex;align-items:stretch;gap:12px;transition:all .35s ease}
.toy{min-width:0;flex:1;position:relative;border:1px solid #bb916d;border-radius:4px;overflow:hidden;background:#89483a;transition:flex .45s ease,opacity .45s ease,filter .45s ease,background .45s ease;cursor:grab}
.toy:active{cursor:grabbing}.toy:hover{border-color:#efcc87}.toy::after{content:'';pointer-events:none;position:absolute;inset:6px;border:1px solid rgba(244,219,167,.12)}
.gallery.focus .toy{flex:.55;filter:brightness(.64);opacity:.76}.gallery.focus .toy.selected{flex:2.9;filter:none;opacity:1;background:#9a5544;border-color:#eed29a;box-shadow:0 0 25px #f3cf7444}
.toy canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}
.toy .overhead{pointer-events:none;position:absolute;top:18px;left:17px;right:17px;display:flex;justify-content:space-between;gap:5px;align-items:center}
.num{font-size:12px;color:#dfc4a7}.active-tip{font-size:11px;color:#f2d095;white-space:nowrap;opacity:0;transition:opacity .3s}.toy.selected .active-tip{opacity:1}
.toy .foot{pointer-events:none;position:absolute;left:18px;right:18px;bottom:17px;display:flex;flex-direction:column;gap:5px}
.toy .name{font-size:clamp(17px,1.75vw,26px);letter-spacing:.14em;color:#fff0cf}.toy .desc{font-size:12px;color:#e2c7ac;line-height:1.6}.gallery.focus .toy:not(.selected) .desc{opacity:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.buttons{display:flex;gap:9px;flex-wrap:wrap}
.action{font:inherit;font-size:13px;padding:10px 17px;background:#b67d5d;color:#231a15;border:1px solid #e0b98a;border-radius:2px;cursor:pointer;transition:background .2s}
.action:hover{background:#f2ce92}.action.secondary{background:transparent;color:#f1d7b5}
.message{font-size:13px;color:#ecd8bb;min-height:18px}.fineprint{font-size:11px;line-height:1.7;color:#d9bea5;max-width:850px;margin-top:10px;opacity:.83}
@media(max-width:920px){main{padding:24px 18px}.layout{grid-template-columns:1fr;gap:24px}.intro{gap:10px}.reference-frame{display:none}.gallery{height:490px;min-height:370px}.intro p{max-width:unset}.toy .desc{display:none}}
@media(max-width:550px){header{padding:14px 18px}.brand{font-size:17px}.tag{display:none}.layout{min-height:unset}.gallery{gap:5px;min-height:360px;height:62vh}.toy .foot{left:7px;bottom:12px;right:7px}.toy .name{font-size:15px}.toy .overhead{top:10px;left:9px;right:9px}.active-tip{display:none}.gallery.focus .toy.selected{flex:3.6}.gallery.focus .toy:not(.selected){flex:.35}.section-sub{display:none}}

function choose(id){selected=id;gallery.classList.add('focus');for(const toy of document.querySelectorAll('.toy'))toy.classList.toggle('selected',toy.dataset.id===id);message.textContent=KEY[id]+' · 拖动旋转，滚轮缩放';playBtn.textContent={bolanggu:'摇动拨浪鼓',xiaoniren:'转动泥人',xiaofengche:'吹转小风车'}[id];}
function clear(){selected=null;gallery.classList.remove('focus');for(const toy of document.querySelectorAll('.toy'))toy.classList.remove('selected');message.textContent='点击一件玩具查看细节';playBtn.textContent='试玩动作';}
for(const toy of document.querySelectorAll('.toy')){
 const id=toy.dataset.id;try{viewers[id]=new Viewer(id,toy);}catch(e){console.error(e);toy.insertAdjacentHTML('beforeend','<span style="position:absolute;top:35%;left:12px;color:#fff">当前浏览器未能初始化 3D：'+e.message+'</span>');}
 toy.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(id);}});
 toy.addEventListener('click',()=>choose(id));
}
function animate(ms){for(const v of Object.values(viewers))v.draw(ms);requestAnimationFrame(animate);}requestAnimationFrame(animate);
document.getElementById('resetAll').onclick=clear;
document.getElementById('resetView').onclick=()=>{for(const v of Object.values(viewers)){v.x=.1;v.y=-.25;v.zoom=4.6;v.spin=0;v.playUntil=0;}message.textContent='视角已重置';};
document.addEventListener('keydown',e=>{if(e.key==='Escape')clear();});
let audio=null;function note(freq,duration,type='sine',volume=.03,delay=0){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let osc=audio.createOscillator(),gain=audio.createGain(),at=audio.currentTime+delay;osc.type=type;osc.frequency.setValueAtTime(freq,at);osc.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.55),at+duration);gain.gain.setValueAtTime(volume,at);gain.gain.exponentialRampToValueAtTime(.001,at+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(at);osc.stop(at+duration+.03);}catch(e){console.warn('声音不可用',e);}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent='音效：'+(soundOn?'开':'关');};
playBtn.onclick=()=>{if(!selected){choose('bolanggu');}let v=viewers[selected];if(!v)return;v.playUntil=performance.now()+2300;if(selected==='bolanggu'){for(let i=0;i<5;i++)note(115+i%2*25,.12,'triangle',.032,i*.19);message.textContent='拨浪鼓摇响 · 咚、咚、咚';}else if(selected==='xiaoniren'){note(450,.2,'sine',.012);message.textContent='泥塑童子 · 转动欣赏衣饰';}else{note(690,.6,'sine',.012);note(840,.4,'sine',.006,.18);message.textContent='小风车 · 纸叶迎风旋转';}};
</script>
<script>playBtn.addEventListener('click',()=>{if(selected&&viewers[selected])parent.postMessage({type:'bianjing-toy-played',toy:selected},location.origin==='null'?'*':location.origin)});</script></body></html>

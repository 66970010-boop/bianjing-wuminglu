<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>铜钱动效验证</title><style>body{margin:0;background:#000;color:#c7b58d}#stage{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:min(900px,100vw);height:450px}h1{position:absolute;top:40%;width:100%;text-align:center;font:40px SimSun}pre{position:absolute;bottom:0;white-space:pre-wrap}button{position:relative;z-index:3}</style><button>开始动效检查</button><h1>静心，掷钱。</h1><div id="stage"></div><pre id="report"></pre><script type="module">
import {createCoinStage} from './coin-stage.js';import {dissolveText} from './text-dissolve.js';
document.querySelector('button').onclick=async()=>{
 const host=document.querySelector('#stage'),stage=await createCoinStage(host);host.style.visibility='hidden';
 const intervals=[];let last=0,active=true;const sample=t=>{if(last)intervals.push(t-last);last=t;if(active)requestAnimationFrame(sample);};requestAnimationFrame(sample);
 await dissolveText(document.querySelector('h1'),document.body,false);host.style.visibility='visible';await stage.arrive();const checks=[];
 for(let i=0;i<8;i++){const values=[0,1,2].map(j=>i&(1<<j)?3:2);await stage.toss(values);const s=stage.inspect();checks.push({values,visible:s.visible.map(v=>v.value),center:s.centerErrorPx,pass:s.visible.every((v,j)=>v.value===values[j])&&Math.abs(s.centerErrorPx)<1});}
 active=false;const sorted=[...intervals].sort((a,b)=>a-b);document.querySelector('#report').textContent=JSON.stringify({frames:intervals.length,p95:sorted[Math.floor(sorted.length*.95)],max:sorted.at(-1),over50:intervals.filter(t=>t>50).length,checks},null,2);
};
</script>
